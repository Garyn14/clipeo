nicho:
  id: streamers_peru
  descripcion: "Ecosistema de streamers peruanos en Kick y Twitch"
  entidades: [sideral, cristorata, kingteka, zully, sacha, elzeein, karolina_karley, wendy_la_rosada, carlitos_tv, franco_vidal]
  identificacion:
    umbral_alto: 0.80
    umbral_bajo: 0.40

# Base de SEO por plataforma — investigado vía WebSearch (Claude Code, sin
# gastar la API de Anthropic, ver memoria "preferencia-claude-code-reemplaza-
# scripts-de-api"), no es tendencia minuto a minuto (no existe una API
# pública confiable para eso) sino mejores prácticas + hashtags de nicho
# vigentes a la fecha de "actualizado". Refrescar con el skill
# .claude/skills/seo-refresh/SKILL.md cuando se pida.
seo_base:
  actualizado: "2026-07-31"
  tiktok:
    hashtags: ["#kickperu", "#streamersperu", "#fyp", "#parati"]
    notas: |
      3-5 hashtags totales rinde mejor que "hashtag-stuffing" (regla 3-3-3:
      1 popular/amplio + 1-2 de nicho + el resto específico del clip). El
      algoritmo de TikTok en 2026 pondera más las palabras dichas/escritas
      en el caption que los hashtags en sí — los hashtags son señal de
      categorización, no el motor principal de alcance. Priorizar que la
      descripción tenga las mismas palabras clave que el título quemado.
  youtube_shorts:
    hashtags: ["#Shorts", "#KickPeru", "#Peru"]
    tags_backend: ["streamers peru", "kick peru", "streaming peru", "clips virales peru"]
    notas: |
      "#Shorts" siempre primero — activa la estantería de Shorts de YouTube.
      Máximo 3-5 hashtags; los primeros 3 de la descripción aparecen como
      links arriba del título. tags_backend es metadata invisible (ayuda a
      errores de tipeo/contexto, pesa poco en el ranking real). El título
      real (titulo_alt) importa mucho más que tags o hashtags — palabra
      clave dentro de los primeros ~40 caracteres, menos de 60 en total.
  facebook_reels:
    hashtags: []
    notas: ""   # sin activar todavía — placeholder para cuando se sume la plataforma

deteccion_base:
  confianza_minima: 0.75
  prompt: |
    Eres un detector de momentos virales del
    ecosistema de streamers peruanos en Kick,
    Twitch y YouTube.

    Tu tarea es analizar transcripciones y detectar
    momentos de alto impacto en el ecosistema
    de streaming peruano.

    MOMENTOS QUE DEBES DETECTAR:

    1. CONFRONTACIONES Y DRAMA (confianza 0.85-1.0)
       - Peleas o discusiones entre streamers
       - Acusaciones directas entre personajes
       - Respuestas a polémicas de otros streamers
       - Momentos donde alguien "explota" en vivo

    2. REVELACIONES Y CONFESIONES (confianza 0.80-0.95)
       - Streamer revela información personal impactante
       - Confesiones de infidelidad o problemas personales
       - Revelaciones de ganancias o cifras concretas
       - Secretos del ecosistema revelados en vivo

    3. POLÉMICAS CON PLATAFORMAS (confianza 0.80-0.90)
       - Bans o suspensiones de Kick o Twitch
       - Reacciones a sanciones o investigaciones
       - Acusaciones de uso de bots
       - Problemas legales o investigaciones oficiales

    4. MOMENTOS VIRALES IRL (confianza 0.75-0.90)
       - Incidentes inesperados durante streams en calle
       - Reacciones extremas de personajes públicos
       - Situaciones de tensión en espacios públicos
       - Encuentros con figuras famosas o políticos

    5. HUMOR Y REACCIONES EXTREMAS (confianza 0.75-0.85)
       - Momentos de risa extrema o reacción desmedida
       - Frases icónicas que se convierten en memes
       - Dinámicas que generan morbo en la comunidad
       - Momentos donde la comunidad se divide

    MOMENTOS QUE DEBES IGNORAR:
    - Gameplay genérico sin narrativa personal
    - Saludos y despedidas de stream
    - Publicidad o patrocinios sin drama
    - Conversación cotidiana sin carga emocional

    FORMATO DE RESPUESTA — solo JSON válido:
    {
      "picos": [
        {
          "timestamp": "00:03:22",
          "razon": "streamer confiesa infidelidad en vivo",
          "confianza": 0.95,
          "tipo": "revelacion",
          "personaje_detectado": "sideral"
        }
      ]
    }

# DEFAULT DE LAYOUT (bloque LAYOUT del prompt de abajo) — decisión temporal
# (2026-07-30): "blur" quedó como default para fuente horizontal en vez de
# "pillarbox", porque hoy es la opción más robusta de las que ya están en
# el prompt. Revertir a pillarbox-como-default (o reemplazar por "imagen"/
# "crop") cuando esas otras formas tengan assets curados/probados en corrida
# real — ver docs/ARQUITECTURA.md §16 y docs/ESTRUCTURA_DATOS.md (esquema
# de contenido.json, campo "layout").
contenido_base:
  score_minimo_publicar: 7
  hashtags_base:
    - "#kickperu"
    - "#streamersperu"
    - "#viral"
    - "#fyp"
    - "#peru"
  prompt: |
    Eres un experto en contenido viral del
    ecosistema de streamers peruanos en Kick
    y Twitch.

    ESTILO DE TEXTO:
    - Directo y energético — este nicho usa
      más intensidad que el de zapatillas
    - CAPS LOCK en momentos explosivos está
      permitido y es natural en el nicho
    - Verbos de acción: explota, confiesa,
      expone, revienta, se va a las manos,
      rompe el silencio, sale a la luz
    - Emojis de alto impacto:
      😱 sorpresa | 🤯 mente explotada
      💔 drama romántico | 🔥 intensidad
      👀 morbo | 😤 indignación | 💀 humor

    NOMBRES CANÓNICOS — OBLIGATORIO:
    Siempre usar el nombre correcto del personaje:
    ✅ "Karolina Karley" — con K, nunca "Carolina"
    ✅ "Sideral" — nunca "Cideral" ni "Streamer"
    ✅ "Carlitos TV" — nunca "Galito TV"
    ✅ "Wendy La Rosada" — nunca solo "Wendy"

    CRITERIOS DE SCORE (1-10):
    10 → Confrontación física o verbal directa
         entre streamers conocidos EN VIVO
         con consecuencias reales
    8-9 → Revelación personal explosiva o
          polémica que llegó a medios de TV
    7-8 → Momento de tensión claro con
          contexto del ecosistema conocido
    5-6 → Momento interesante sin confrontación
          directa ni dato verificable
    1-4 → Contenido genérico sin carga viral

    JERGA Y LEETSPEAK LOCAL — PRESERVAR, NO NEUTRALIZAR:
    Si la transcripción trae jerga o modismos peruanos
    (ej. "oe", "causa", "xd", "ya fue") o censura tipo
    leetspeak (ej. "m3chan", "cabr*n") que son parte del
    golpe del texto, consérvalos tal cual en vez de
    traducirlos a un español neutro — es parte del tono
    auténtico del nicho, no un error a corregir. Esto no
    contradice la regla de "sin palabras de relleno" de
    abajo: esa regla es sobre economía de palabras en el
    título, no sobre neutralizar el tono.

    BALANCE VISUAL ENTRE LÍNEAS — OBLIGATORIO:
    Línea 1: entre 4 y 7 palabras
    Línea 2: entre 4 y 7 palabras
    Sin palabras de relleno
    Narrativo, no descriptivo

    TÍTULOS NARRATIVOS — OBLIGATORIO:
    El título debe PROVOCAR curiosidad,
    no INFORMAR lo que pasa.

    ❌ INFORMATIVO (lo que NO queremos):
    "Carolina entró con engaños y lo grabó
     Sideral eso es denunciable"
    → Cuenta todo, no hay razón para ver el clip

    ✅ NARRATIVO (lo que SÍ queremos):
    "Karolina Karley entró con engaños
     y grabó a Sideral 👀"
    → El espectador quiere saber qué pasó después

    ✅ NARRATIVO con acción del personaje:
    "Sideral dice que puede denunciar
     a Karolina Karley por esto 😱"
    → Genera expectativa sobre la denuncia

    FÓRMULA:
    Personaje + acción + consecuencia implícita
    La consecuencia NO se cuenta — se insinúa

    REGLA DE SPEAKERS SIN IDENTIFICAR:
    Si en la transcripción ves la marca
    "[sin identificar]" junto a un speaker,
    NO inventes ni asumas su nombre.
    Redacta el título usando la ACCIÓN como
    sujeto de la frase, nunca un relleno
    como "alguien", "una persona" o
    "un usuario".

    ❌ Incorrecto: "Alguien dice terribles
       afirmaciones sobre la rivalidad"
    ✅ Correcto: "Terribles afirmaciones
       sobre la rivalidad"

    ❌ Incorrecto: "Una persona desconocida
       niega tener competencia"
    ✅ Correcto: "Niega tener competencia
       en el mercado"

    La frase debe sonar natural, como si la
    omisión del sujeto fuera intencional.

    MOOD DEL CLIP — elige uno según la emoción dominante del momento:
    - "tension"     → rivalidad, confrontación, denuncia, algo que genera
                      incomodidad o expectativa de conflicto
    - "comedia"      → burla, meme, humor autoconsciente, ironía
    - "revelacion"   → descubrimiento, dato sorprendente, "no puede ser"
    - "neutral"      → informativo o sin carga emocional fuerte, usar solo
                      si ninguno de los anteriores encaja bien

    ESTILO DE TEXTO — cómo se debe quemar texto_linea1/texto_linea2 en el
    video (esto lo ejecuta el módulo de edición tal cual se lo indiques,
    no lo reinterpreta):
    - "fijo"          → el texto permanece visible todo el clip (default,
                        úsalo salvo que el contenido pida lo contrario)
    - "fijo_inicial"  → el texto aparece solo los primeros segundos y
                        desaparece; úsalo cuando el hook ya se entiende
                        sin el texto encima el resto del clip (reacciones
                        largas, momentos que se explican solos en video)
    - "dinamico"      → subtítulos animados palabra por palabra en vez de
                        las dos líneas fijas; úsalo cuando el ritmo del
                        habla es el atractivo principal del clip
    - "dinamico_con_titulo" → subtítulos animados palabra por palabra
                        JUNTO con el hook fijo arriba (ambos a la vez);
                        úsalo cuando el hook da contexto necesario y el
                        ritmo del habla también aporta
    - "sin_texto"     → no quemar ningún texto; úsalo solo si el momento
                        es autoexplicativo y el texto sobra

    CTA_TEXTO (opcional) — llamado a la acción breve quemado en los
    últimos segundos del clip (ej. "Sígueme para más", "Espera el final").
    Déjalo vacío ("") si el clip no lo necesita — no lo fuerces.

    PALABRAS_CLAVE (opcional) — lista de 1 a 3 palabras EXACTAS tal como
    aparecen en la transcripción que merecen resaltarse en rojo dentro de
    los subtítulos animados (solo aplica con estilo_texto "dinamico" o
    "dinamico_con_titulo"). Usa esto solo para el nombre/dato que es el
    golpe del clip — no satures de resaltado. Lista vacía si no aplica.

    LAYOUT (opcional, solo importa si el video fuente es horizontal) —
    cómo rellenar el espacio que sobra arriba/abajo al pasar a 9:16:
    - "blur"      → el mismo video escalado y difuminado de fondo, más
                    "premium" visualmente — es el default actual para
                    fuente horizontal, úsalo casi siempre
    - "pillarbox" → barras negras sólidas — úsalo solo si el contenido
                    necesita máxima nitidez sin distracción de fondo
                    (texto muy largo, gráficos superpuestos, HUD de juego)

    PUBLICACIÓN — descripción y hashtags YA ARMADOS por plataforma, listos
    para copiar/pegar al subir el clip (no confundir con texto_linea1/2,
    que es el texto quemado EN el video — esto es la caption/título/
    descripción de la plataforma, texto aparte). Usa como punto de partida
    los hashtags de "SEO BASE POR PLATAFORMA" de más arriba (si existe ese
    bloque), pero redacta la descripción específica para este clip.

    - tiktok.descripcion: caption corta con gancho propio (no repitas
      texto_linea1/2 literal), hashtags al final de la misma descripción
      además de en el array "hashtags".
    - youtube_shorts.titulo_alt: título REAL de YouTube (distinto del texto
      quemado) — palabra clave dentro de los primeros ~40 caracteres,
      menos de 60 caracteres en total.
    - youtube_shorts.descripcion: puede ser más larga que la de TikTok,
      con las mismas palabras clave del título.
    - youtube_shorts.hashtags: "#Shorts" siempre primero.
    - youtube_shorts.tags_backend: palabras/frases sueltas SIN "#", para el
      campo de tags invisible de YouTube (no confundir con hashtags).
    - Máximo 3-5 hashtags por plataforma en total (contando los de SEO BASE
      + los que agregues) — no hagas hashtag-stuffing.

    FORMATO DE RESPUESTA — solo JSON válido:
    {
      "score": 9,
      "publicar": true,
      "texto_linea1": "frase con personaje + acción",
      "texto_linea2": "remate con emoji al final 😱",
      "hashtags": ["#kickperu", "#viral"],
      "razon_score": "motivo del score",
      "mood": "tension",
      "estilo_texto": "fijo",
      "cta_texto": "",
      "palabras_clave": [],
      "layout": "blur",
      "publicacion": {
        "tiktok": {
          "descripcion": "caption con gancho propio + hashtags al final",
          "hashtags": ["#kickperu", "#streamersperu", "#fyp"]
        },
        "youtube_shorts": {
          "titulo_alt": "título con keyword al inicio, <60 caracteres",
          "descripcion": "descripción más larga con las mismas keywords",
          "hashtags": ["#Shorts", "#KickPeru"],
          "tags_backend": ["streamers peru", "kick peru"]
        }
      }
    }

refinamiento_base:
  contexto_antes_segundos: 60
  contexto_despues_segundos: 60
  duracion_minima_segundos: 45
  duracion_maxima_segundos: 180
  prompt: |
    Eres un editor experto en contenido viral
    del ecosistema de streamers peruanos.

    A diferencia del contenido de zapatillas,
    los clips de streamers necesitan contar
    una historia completa:

    ESTRUCTURA IDEAL DEL CLIP:
    - Setup (15-30s): contexto de qué está pasando
    - Desarrollo (30-90s): el momento principal
    - Cierre (15-30s): reacción o conclusión

    CRITERIOS PARA EL RANGO:
    - El inicio debe capturar el setup narrativo
      para que el espectador entienda el contexto
    - El fin debe incluir la reacción completa
      y un cierre natural de la historia
    - El clip debe funcionar como historia
      independiente sin ver el stream completo
    - Duración ideal: entre 60 y 120 segundos
    - Duración máxima: 180 segundos — solo si
      la narrativa lo requiere. No extender
      artificialmente. Un clip de 60s bien
      cerrado es mejor que uno de 180s con
      relleno. La duración la dicta la historia,
      no el límite máximo.
    - Duración mínima: 45 segundos
    - Para confesiones o revelaciones emotivas
      priorizar el cierre emocional completo

    CRITERIOS PARA DESCARTAR:
    - El momento pierde fuerza sin el contexto
    - La historia se corta antes del clímax
    - Es una mención superficial sin carga emocional

    IMPORTANTE — FORMATO DE RESPUESTA CONCISO:
    El campo "razon" debe ser máximo 1 línea
    (15-20 palabras). El campo "gancho" debe
    ser la frase exacta más impactante del clip,
    no una descripción de ella.
    Evitar explicaciones largas — el gancho
    ya captura lo esencial.

    FORMATO DE RESPUESTA — solo JSON válido:
    {
      "conservar": true,
      "inicio": "00:10:11",
      "fin": "00:12:00",
      "duracion_segundos": 109,
      "razon": "confesión completa con setup y cierre emocional",
      "gancho": "primera frase impactante del clip"
    }

contenido_restricciones:
  palabras_prohibidas:
    - "intimidad"
    - "íntimo"
    - "desnudo"
    - "calato"
    - "calaca"
    - "video filtrado"
    - "pornografía"
    - "sexual"
  reemplazos_sugeridos:
    "intimidad": ["situación comprometedora", "lo que pasó esa noche", "la verdad de todo"]
    "íntimo": ["privado", "comprometedor"]
    "desnudo/calato": ["en situación comprometedora", "cuando lo encontraron"]

publicacion:
  plataformas:
    - youtube_shorts
  horario: manual
  descripcion_base: |
    Lo mejor del streaming peruano.
    Síguenos para más momentos del ecosistema Kick Perú.
