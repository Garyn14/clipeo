evento:
  entidad: franco_vidal
  fecha: 2026
  titulo: "Manuel Vidal Camargo (padre) candidato en Ate 2026 e investigado por usurpación de funciones"
  descripcion: |
    Manuel Vidal Camargo, padre del alcalde Franco Vidal, es
    candidato a la alcaldía de Ate para las elecciones 2026 por
    Avanza País — el mismo partido que Franco Vidal dejó en enero
    2026. Paralelamente, la Fiscalía de Lima Este abrió una
    investigación de 120 días contra Manuel Vidal Camargo por
    presunta usurpación de funciones: habría usado personal de
    inspección municipal (dirigido por su hijo) para amenazar con
    cerrar el negocio de un tercero (denuncia de Franklin Yangue).
    Manuel Vidal Camargo tiene además antecedentes de prisión por
    estafa (1997) y proxenetismo (2006), según reportes
    periodísticos — acusaciones que tanto él como Franco Vidal
    calificaron de "leyenda urbana" en vivo.
  tipo: "polemica_grave"
  origen: "refresh_manual"
  aprobado: true
  relevancia: |
    Cruce entre la familia y la política municipal — alto potencial
    de generar preguntas incómodas o confrontaciones si Franco Vidal
    es cuestionado en vivo sobre la candidatura o el pasado de su
    padre. Nota: el dato de un presunto hallazgo de un cuerpo en una
    propiedad del padre (citado en fuentes secundarias, 2013) NO se
    incluye aquí por no estar confirmado en fuente primaria — no usar
    sin verificación adicional.
