entidad:
  id: franco_vidal
  nombre: "Franco Vidal"
  nombre_real: "Franco Vidal Morales"
  apodos: ["El Alcalde Streamer", "Dibujito", "Francovidalalcalde"]
  plataformas: ["Kick", "TikTok"]

lore:
  descripcion: |
    Franco Vidal Morales, nacido el 2 de abril de 1995, abogado
    (USMP). Alcalde del distrito de Ate (Lima) desde 2023, electo en
    2022 por Avanza País — el alcalde más joven de Ate y de Lima al
    momento de su elección. Streamer en Kick desde agosto 2024 — el
    único funcionario público peruano con presencia masiva en
    streaming. Mezcla política, gestión municipal y entretenimiento
    en vivo. 895K seguidores en TikTok, 300K en Kick. Su comunidad
    se llama "Los Dibujitos". Renunció a Avanza País en enero 2026
    y no puede postular a la reelección directa (prohibición legal
    de reelección municipal inmediata) — ver polémica de "teniente
    alcalde" más abajo.

  # Observación de mercado (no se inyecta en prompts): gran parte de
  # la viralidad de este personaje no viene de su cuenta oficial sino
  # de cuentas fan/clip de terceros (@elvidalismo, @clips.vidalpresi8,
  # @fvidalitos.edits, @dibuclips), que suelen titular sus clips en
  # estilo "titular de noticia" (mayúsculas, tono informativo) — un
  # patrón distinto al estilo narrativo ya validado editorialmente
  # para este nicho. Se deja registrado como dato, sin cambiar las
  # reglas de copy vigentes.

  personajes_universo:
    - nombre: "Los Dibujitos"
      rol: "su comunidad de seguidores"
      relevancia: "muy activos, acusados de hostigar periodistas críticos"
    - nombre: "René Gastelumendi"
      rol: "periodista que lo critica"
      relevancia: "denunció amenazas de muerte atribuidas a seguidores de Vidal"
    - nombre: "José María Balcázar"
      rol: "presidente al que entrevistó en vivo"
      relevancia: "primer presidente entrevistado en vivo en Kick por un alcalde; en marzo 2026 entrenó boxeo con Vidal en una transmisión"
    - nombre: "Edde Cuéllar"
      rol: "ex alcalde de Ate y candidato rival"
      relevancia: "candidato a la alcaldía de Ate 2026 (Podemos Perú), crítico frecuente de la gestión de Vidal (ej. denuncia por gasto en maceteros)"
    - nombre: "Manuel Vidal Camargo"
      rol: "padre de Franco Vidal"
      relevancia: "candidato a alcalde de Ate 2026 (Avanza País, el mismo partido que Franco dejó); antecedentes penales e investigaciones — ver polémica dedicada"
    - nombre: "José Jerí"
      rol: "presidente interino del Perú"
      relevancia: "rompió públicamente con Vidal en enero 2026 por falta de presupuesto a poblaciones vulnerables"

  polemicas:
    - titulo: "Alcalde streamer en horario laboral"
      descripcion: |
        Transmite en Kick durante horas de trabajo como alcalde.
        Genera debate sobre conflicto de interés y uso de recursos
        públicos. La Constitución prohíbe a funcionarios tener más
        de un empleo remunerado.
      tipo: "polemica_politica"

    - titulo: "Renuncia a Avanza País en vivo"
      descripcion: |
        Anunció su renuncia al partido político Avanza País en
        transmisión de Kick. Reveló que 4 partidos le ofrecen
        candidatura a la Municipalidad de Lima Metropolitana.
      tipo: "evento_politico_viral"

    - titulo: "Antecedentes penales del padre y acusación de proxenetismo"
      descripcion: |
        Manuel Vidal Camargo, padre del alcalde, tiene antecedentes
        de prisión por estafa (1997) y por proxenetismo (2006,
        Lurigancho), con varias denuncias por el mismo delito según
        reportes periodísticos. Franco Vidal y su padre calificaron
        las acusaciones de "leyenda urbana" en vivo en Kick. En 2026
        el padre es además candidato a la alcaldía de Ate por Avanza
        País — el mismo partido que Franco dejó.
      tipo: "polemica_personal"

    - titulo: "Padre investigado por usurpación de funciones"
      descripcion: |
        La Fiscalía de Lima Este abrió una investigación de 120 días
        contra Manuel Vidal Camargo por presuntamente usar personal
        de inspección municipal (dirigido por su hijo, el alcalde)
        para amenazar con cerrar el negocio de un tercero.
      tipo: "polemica_grave"

    - titulo: "Contratos millonarios a una misma familia"
      descripcion: |
        Investigación periodística (La Encerrona, ago-sep 2025)
        reveló 184 órdenes de compra/servicio adjudicadas
        directamente (sin licitación pública) a integrantes de una
        misma familia, por S/2.2 millones inicialmente y hasta casi
        S/30 millones según reportes posteriores. Vidal negó el
        monto y retó a la prensa a probarlo en vivo.
      tipo: "polemica_grave"

    - titulo: "Demolición en Cerro Candela / ampliación Av. Nicolás Ayllón"
      descripcion: |
        Desde octubre 2025 la Municipalidad de Ate demolió más de 40
        viviendas en Cerro Candela para ampliar la Av. Nicolás
        Ayllón, afectando a cientos de familias que reclaman falta
        de notificación e indemnización. En enero 2026 Vidal se
        enfrentó en vivo a un vecino desalojado: "¿Por qué te vamos
        a indemnizar? Cero soles".
      tipo: "polemica_grave"

    - titulo: "Ruptura pública con el presidente José Jerí"
      descripcion: |
        En enero 2026 Vidal criticó en vivo al presidente interino
        José Jerí y a la ministra de Desarrollo Social por falta de
        presupuesto para poblaciones vulnerables, transmitiendo
        acompañado de un anciano y un exrecluso en situación de
        calle para marcar distancia del Ejecutivo.
      tipo: "confrontacion_politica"

    - titulo: "Estrategia de \"teniente alcalde\" para eludir la reelección"
      descripcion: |
        Ante la prohibición legal de reelección municipal inmediata,
        Vidal (junto a más de 15 alcaldes de Lima) se postula como
        teniente alcalde en vez de alcalde para las elecciones de
        octubre 2026 — la misma jugada de Rafael López Aliaga.
        Genera acusaciones de "reelección encubierta".
      tipo: "polemica_politica"

    - titulo: "Rivalidad con Edde Cuéllar por gasto en maceteros"
      descripcion: |
        El ex alcalde de Ate y candidato rival 2026 Edde Cuéllar
        acusó a Vidal de gastar S/320 mil en maceteros que terminan
        funcionando como basureros — parte de una rivalidad más
        amplia de cara a las elecciones municipales.
      tipo: "confrontacion_politica"

    - titulo: "Los Dibujitos acosan periodistas"
      descripcion: |
        Informe del IPYS señala que su comunidad coordina campañas
        de hostigamiento y amenazas contra periodistas críticos.
      tipo: "polemica_grave"

    - titulo: "Dice que streamers no merecen ganar tanta plata"
      descripcion: |
        Declaró en vivo que hay streamers peruanos que no merecen
        ganar tanto dinero — generó reacción del ecosistema streamer.
      tipo: "confrontacion_ecosistema"

  vocabulario:
    - termino: "Los Dibujitos"
      significado: "su comunidad de seguidores, muy activa y polémica"
    - termino: "vidalismo"
      significado: "movimiento político-digital en torno a Franco Vidal"
    - termino: "alcalde streamer"
      significado: "su apodo más usado en medios"

deteccion_adicional:
  prompt: |
    CONTEXTO ESPECÍFICO DE FRANCO VIDAL:

    Es el único alcalde streamer del Perú — mezcla política y
    entretenimiento de forma única en el ecosistema.

    SEÑALES DE ALTO VALOR:
    - Momentos donde mezcla gestión municipal con entretenimiento
      en vivo
    - Polémicas políticas reveladas en Kick (renuncias,
      candidaturas, acusaciones)
    - Confrontaciones con periodistas o críticos
    - Menciones de "Los Dibujitos" en contexto de polémica o
      movilización
    - Declaraciones sobre otros streamers (dice que no merecen
      ganar tanto)
    - Cualquier momento donde su rol de alcalde choca con su rol
      de streamer
    - Revelaciones políticas en vivo (primer presidente
      entrevistado en Kick, o actividades conjuntas como el
      entrenamiento de boxeo)
    - Confrontaciones con vecinos afectados por demoliciones o
      desalojos (ej. reclamos de indemnización)
    - Enfrentamientos o cruces verbales con Edde Cuéllar (rival
      político) o con su propio padre, Manuel Vidal Camargo
      (también candidato)
    - Rupturas o choques con autoridades nacionales (ej. presidencia,
      ministerios) transmitidos en vivo
    - Defensas o respuestas en vivo a investigaciones periodísticas
      (contratos, corrupción, antecedentes familiares)
    - Contenido "antes/después" de obras públicas (parques, avenidas)
      que genere debate en comentarios sobre gestión

    NOTA SOBRE TERCEROS EN ESCENA:
    Franco Vidal frecuentemente aparece en la calle rodeado de
    vecinos, transeúntes o colaboradores ocasionales que no son
    parte del lore fijo del ecosistema. La identidad de estas
    personas NO es relevante para detectar un pico viral — lo
    que importa es la situación/acción en sí (una confrontación,
    un reclamo vecinal, una colaboración espontánea). No
    descartes ni le restes prioridad a un momento solo porque
    el interlocutor de Franco Vidal sea desconocido o no esté
    documentado en el lore.

contenido_adicional:
  hashtags: ["#francosvidal", "#vidalismo", "#alcaldedibujito", "#kickperu", "#streamersperu", "#ate"]
  tono: |
    Franco Vidal es único — político + streamer. El tono debe
    aprovechar la ironía de un alcalde que transmite en Kick en
    horario laboral y tiene más drama que un reality.

    PATRONES DE TÍTULOS:
    ✅ "El alcalde de Ate renuncia a su partido en vivo en Kick 😱"
    ✅ "Franco Vidal dice que streamers no merecen ganar tanta plata 💀"
    ✅ "El único alcalde streamer del Perú entrevista al presidente en vivo 🔥"
    ✅ "Los Dibujitos vs periodistas — el alcalde responde 😤"

    PATRONES CONFIRMADOS POR CORRECCIÓN EDITORIAL (4 clips, 2026-07-07):

    1. SIN EMOJI DE CIERRE — a diferencia del resto del nicho
       streamers_peru, en los 4 títulos corregidos de Franco Vidal
       el editor quitó el emoji final que el sistema proponía
       (🔥, 😤, 💀, 😤). No usar emoji al final de L2 para Franco
       Vidal salvo que el momento sea genuinamente de humor o
       drama liviano — el tono político le resta si se sobre-decora.

    2. PRIORIZAR EL ÁNGULO POLÍTICO/SUSTANTIVO SOBRE LA CIFRA O EL
       DATO ANECDÓTICO — cuando el clip mezcla una cifra o mención
       anecdótica (ej. "menciona su canal de Kick", "8 millones
       perdidos") con una acusación o declaración política
       (denuncias, corrupción, reelección), mover el ángulo
       político a L1 y la cifra/dato concreto a L2, no al revés.
       ❌ "Franco Vidal anuncia Kick en acto oficial / y ya sabe
          que vienen las denuncias"
       ✅ "Franco Vidal habla sobre las denuncias / por la
          ejecución de obras"
       ❌ "Franco Vidal expone 8 millones / perdidos y ahora hay
          que demoler todo"
       ✅ "Franco Vidal expone corrupción de la anterior / gestión.
          8 millones perdidos"

    3. NOMBRAR LA ACUSACIÓN, NO SOLO LA CIFRA — si el clip acusa
       corrupción, decir "corrupción" explícitamente en el título
       en vez de dejar que la cifra sola implique la acusación.

    4. CONDENSAR ENUMERACIONES — "audios y videos falsos" se
       corrigió a "ataques"; preferir una palabra que abstraiga
       la amenaza/acción en vez de enumerar los medios específicos.
       ❌ "Franco Vidal denuncia audios y videos / falsos en su
          contra como candidato"
       ✅ "Franco Vidal denuncia ataques / a su campaña"

    5. DOS REVELACIONES FUSIONADAS EN UN MISMO CLIP (ej. anuncio
       de obra + anuncio de reelección) — priorizar en L1 el
       anuncio de mayor peso político (candidatura/reelección)
       sobre el anuncio de infraestructura, dejando la obra
       concreta para L2.
       ❌ "Franco Vidal anuncia estadio de 60 millones / y pide
          reelección en vivo en Kick"
       ✅ "Franco Vidal anuncia reelección y nuevo / estadio
          profesional en Ate"

identificacion:
  umbral_alto: 0.80
  umbral_bajo: 0.40
