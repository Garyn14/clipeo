evento:
  entidad: franco_vidal
  fecha: 2025-10
  titulo: "Demolición en Cerro Candela por ampliación de la Av. Nicolás Ayllón"
  descripcion: |
    Desde el 31 de octubre de 2025 la Municipalidad de Ate demolió
    más de 40 viviendas en Cerro Candela para ampliar la avenida
    Nicolás Ayllón (Carretera Central), en un proyecto que afecta a
    cientos de familias. Vecinos denunciaron falta de notificación
    formal pese a tener títulos de propiedad. El conflicto continuó
    varios meses: en enero 2026 Vidal se enfrentó en vivo a un
    vecino desalojado que reclamaba indemnización, respondiéndole
    "¿Por qué te vamos a indemnizar? Cero soles". En mayo 2026
    seguían reportándose familias resistiéndose a dejar viviendas
    de más de dos décadas.
  tipo: "polemica_grave"
  origen: "refresh_manual"
  aprobado: true
  relevancia: |
    Muy alto potencial viral: confrontación directa en vivo con un
    vecino afectado, frase contundente ("cero soles") con carga
    emocional fuerte. Patrón recurrente — el conflicto se extendió
    de oct-2025 a mayo-2026, así que pueden aparecer varios
    momentos de este mismo tema en distintas fechas.
