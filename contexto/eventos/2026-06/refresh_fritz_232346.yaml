  titulo: 'Segundo atentado en menos de una semana: balean tienda Fritz Sport en Los
    Olivos'
  descripcion: El 30 de junio de 2026, delincuentes armados atacaron a balazos la
    tienda de Fritz Sport ubicada en la avenida Alfredo Mendiola, en Los Olivos. El
    vigilante Randy Pulido Rupay, de 44 años, recibió un impacto de bala en el abdomen
    y fue trasladado de emergencia a una clínica cercana. Se hallaron hasta cuatro
    casquillos de bala en la escena. El hecho fue cubierto por RPP, Radio Nacional
    y el programa Buenos Días Perú de Panamericana Televisión.
  relevancia: Es el segundo atentado en menos de una semana contra el negocio de Tío
    Fritz, lo que catapultó su caso a los medios nacionales (RPP, La República, Trome,
    Caretas). Genera alto volumen de búsquedas y conversación en redes sobre extorsión
    a empresarios exitosos en Perú.
