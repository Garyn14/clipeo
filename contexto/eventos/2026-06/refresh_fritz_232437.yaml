  titulo: Balean a guardaespaldas de Tío Fritz en Av. Grau; PNP investiga extorsión
  descripcion: La noche del viernes 26 de junio de 2026, el agente de seguridad Andrés
    Meza Echajalla fue baleado mientras custodiaba la tienda de Fritz Sport ubicada
    en la cuadra 2 de la avenida Grau, Cercado de Lima. El ataque ocurrió en plena
    vía pública frente a clientes. La Policía Nacional investiga el caso bajo la hipótesis
    de extorsión, señalando que el negocio ya habría recibido amenazas desde el año
    anterior. Se analizaron cámaras de seguridad para identificar a los atacantes.
  relevancia: Primer atentado de la serie que desató cobertura mediática masiva. Trome,
    La República, Diario Correo y Caretas cubrieron el hecho. Posiciona a Tío Fritz
    como empresario emprendedor víctima de la criminalidad organizada, narrativa muy
    poderosa para contenido viral.
