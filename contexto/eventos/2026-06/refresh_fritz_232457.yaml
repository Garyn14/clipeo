  titulo: Polémica con 'Notorius' por sorteos de Fritz Sport cuestionados como estafa
  descripcion: En TikTok circularon clips virales en los que el creador de contenido
    'Notorius' cuestionó las dinámicas de sorteos de Fritz Sport, sugiriendo que podrían
    ser una 'jugada de palta' (engaño). Los clips generaron debate en el ecosistema
    de zapatillas peruanas sobre la legitimidad de los premios ofrecidos (incluyendo
    iPhones y joyería). La comunidad se dividió entre defensores de Tío Fritz y escépticos.
  relevancia: Las polémicas con otros creadores del nicho (Notorius, Tío Yolu) son
    el combustible principal del contenido viral en este ecosistema. Este enfrentamiento
    indirecto activa a la audiencia de ambos lados y genera alto engagement.
