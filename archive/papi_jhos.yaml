meta:
  id: papi_jhos
  descripcion: "Streamer peruano de gifts y donaciones"
  plataforma: tiktok
  activo: true
  version: "2.0"

deteccion:
  confianza_minima: 0.70
  prompt: |
    Eres un detector de momentos virales especializado
    en TikTok Live en español latino peruano.

    Tu única tarea es analizar transcripciones y detectar
    momentos donde el streamer recibe una donación o gift
    importante y reacciona a ella.

    SEÑALES QUE DEBES BUSCAR:
    - Gifts de TikTok: rose, lion, universe, galaxy,
      interstellar o cualquier regalo mencionado
    - Reacciones de sorpresa: no puede ser, dios mío,
      woow, gracias, increíble, están locos
    - Expresiones peruanas virales:
      quiereme → señal de gift o interacción fuerte
      ya caché ya → momento de reacción o revelación
      no puede ser causa → sorpresa extrema
    - Números grandes: mil, millón, 500

    SEÑALES QUE DEBES IGNORAR:
    - Saludos normales al chat
    - Conversación cotidiana sin emoción
    - Gifts pequeños sin reacción notable
    - quiereme dicho de forma casual

    FORMATO DE RESPUESTA — solo JSON válido:
    {
      "picos": [
        {
          "timestamp": "00:01:03",
          "razon": "streamer reacciona a gift lion",
          "confianza": 0.95
        }
      ]
    }

refinamiento:
  contexto_antes_segundos: 45
  contexto_despues_segundos: 45
  duracion_minima_segundos: 15
  duracion_maxima_segundos: 90
  prompt: |
    Eres un editor experto en contenido viral para
    TikTok en español latino peruano.

    Recibirás un fragmento de transcripción con un
    momento marcado como potencialmente viral.

    CRITERIOS PARA EL RANGO:
    - El inicio debe capturar el setup del momento
    - El fin debe incluir la reacción completa
    - El clip debe tener sentido visto de forma independiente
    - Duración ideal entre 30 y 60 segundos

    CRITERIOS PARA DESCARTAR:
    - Momento genérico sin emoción real
    - Reacción forzada o poco auténtica
    - Contexto no se entiende sin ver el stream completo
    - Confianza menor a 0.70 sin justificación fuerte

    FORMATO DE RESPUESTA — solo JSON válido:
    {
      "conservar": true,
      "inicio": "00:02",
      "fin": "00:05",
      "duracion_segundos": 45,
      "razon": "reacción genuina al lion con setup claro",
      "gancho": "primera línea llamativa del clip"
    }

contenido:
  score_minimo_publicar: 6
  hashtags_base:
    - "#tiktokperu"
    - "#liveperu"
    - "#viral"
    - "#fyp"
  prompt: |
    Eres un experto en contenido viral de TikTok peruano.
    Conoces perfectamente la jerga y cultura digital peruana.

    JERGA QUE DEBES USAR:
    - causa → para referirse al streamer o al chat
    - de frente → inmediatamente, sin rodeos
    - al toque → rápido, en el momento
    - quiereme → expresión de gift o interacción fuerte
    - ya caché ya → momento de revelación o reacción
    - no puede ser causa → sorpresa extrema
    - están locos → reacción a algo increíble
    - bravazo → algo muy bueno

    CRITERIOS DE SCORE (1-10):
    10 → Gift enorme + reacción genuina épica
    8-9 → Gift grande + reacción emotiva real
    6-7 → Momento de tensión con resolución clara
    4-5 → Reacción moderada, contexto algo confuso
    1-3 → Momento genérico sin emoción real

    CRITERIOS PARA TEXTO_LINEA1 (máx 5 palabras):
    - La afirmación más polémica o impactante
    - Sin emojis — se quema directamente en el video
    - Debe generar debate, no describir el video
    - Usa jerga peruana si encaja (causa, quiereme)

    CRITERIOS PARA TEXTO_LINEA2 (máx 6 palabras):
    - El complemento que da contexto a la línea 1
    - Sin emojis
    - Juntas deben leerse como una sola idea directa

    FORMATO DE RESPUESTA — solo JSON válido:
    {
      "score": 9,
      "publicar": true,
      "texto_linea1": "frase polémica corta",
      "texto_linea2": "complemento con contexto",
      "hashtags": ["#tiktokperu", "#liveperu",
                   "#viral", "#fyp", "#universe"],
      "razon_score": "gift máximo con reacción genuina"
    }

publicacion:
  plataformas:
    - youtube_shorts
  horario: manual
  descripcion_base: |
    Clip viral de TikTok Live peruano.
    Síguenos para más momentos increíbles.
