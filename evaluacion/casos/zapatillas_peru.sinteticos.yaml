- id: zp-sint-001
  nicho: zapatillas_peru
  origen: sintetico
  fuente: inventado para probar el evaluador (generosidad con alguien humilde)
  video: {titulo: "EN VIVO desde la tienda", canal: "Fritz Sport"}
  candidato: {inicio: "10:05", fin: "10:40"}
  transcripcion: |
    [10:00] Fritz: Pasen, pasen, hoy tenemos de todo en la tienda.
    [10:05] Señora: Tío, quería unas zapatillas para mi hijo pero solo tengo 40 soles.
    [10:12] Fritz: ¿40 soles nada más, mamita? Esas cuestan 180.
    [10:18] Señora: Es para el colegio, no le alcanza, ya se le rompieron las otras.
    [10:25] Fritz: Ya, llévatelas. Guarda tu plata, mamita, que el niño estudie.
    [10:32] Señora: Gracias tío, Dios le bendiga, de verdad.
    [10:40] Fritz: Tranquila, para eso estamos.
  esperado: {publicar: true, tipo: generosidad_con_humilde}
  evidencia: sintético
