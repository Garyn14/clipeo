deteccion_adicional:
  prompt: |
    CONTEXTO ESPECÍFICO DE SIDERAL:

    Sideral es conocido por su drama romántico constante
    y por ser "el santo" que en realidad no lo es.

    SEÑALES ESPECÍFICAS DE ALTO VALOR:
    - Cualquier mención de Karolina Karley en contexto
      emocional — es la víctima de la infidelidad
    - Menciones de Wendy La Rosada — la del ampay
    - Sideral intentando justificar o explicar
      sus acciones románticas
    - Carlitos TV o Ikari Dota exponiendo a Sideral
    - La frase "amiga con derechos" — genera debate
    - Cualquier referencia al video filtrado
    - Sideral culpando a otros de sus problemas
    - Momentos donde la BebaArmy defiende o ataca

    SEÑALES DE HUMOR INVOLUNTARIO (alto engagement):
    - Sideral siendo cachado en contradicción
    - Excusas inverosímiles ante evidencias
    - "el santo Sideral" siendo expuesto

    SEÑALES DE HUMOR VIRAL:
    - Otros streamers se "vacilan" a Sideral
    - Menciones de Macarius como su abogado
    - Referencias al apodo "beba"
    - Sideral actuando como "beba" en cámara

    NOTA DE DURACIÓN:
    Los clips de Sideral sobre drama personal
    necesitan tiempo suficiente para contar
    la historia completa. La duración la dicta
    la narrativa — si el cierre emocional llega
    a los 90s usar 90s, si llega a los 150s
    usar 150s. Nunca cortar antes del cierre.

contenido_adicional:
  hashtags: ["#sideral", "#bebaarmy", "#karolinakarley",
             "#sideraldota", "#kickperu"]
  tono: |
    Para clips de Sideral el tono puede ser
    más dramático y con morbo romántico.
    La comunidad se divide entre defensores
    y detractores — el texto debe provocar
    esa división sin tomar partido.

    PATRONES DE TÍTULOS CONFIRMADOS VIRALES:

    PATRÓN 1 — Exposición con fuente
    ✅ "[Personaje X] expone a Sideral
        con [evidencia concreta] 🤯"
    ✅ "Carlitos TV destruye a Sideral
        con audio de su propia mamá 💀"
    ❌ "Sideral es expuesto" (sin fuente)

    PATRÓN 2 — Confesión en vivo
    ✅ "Sideral confiesa en vivo que
        engañó a Karolina con Wendy 😱"
    ✅ "Sideral rompe el silencio sobre
        el video filtrado 👀"
    ❌ "Sideral habla sobre lo que pasó"

    PATRÓN 3 — División de comunidad
    ✅ "La BebaArmy explota contra
        Sideral después de esto 🔥"
    ✅ "Karolina le dice la verdad
        a la BebaArmy en vivo 💔"
    ❌ "La comunidad reacciona"

    PATRÓN 4 — Meme del Tr3n de aragua
    ✅ "Sideral dice que el Tr3n de aragua
        lo tiene amenazado en vivo 😱"
    ✅ "El Tr3n de aragua aparece en
        el chat de Sideral 💀"
    Nota: escribir 'Tr3n' y 'muert3'
    con número 3 — así lo usa la comunidad

    PATRÓN 5 — Consecuencia real
    ✅ "Sideral pierde 10 mil subs
        después de la polémica con Wendy"
    ✅ "Kick banea a Sideral en vivo
        y la BebaArmy explota 🔥"
    ❌ "Sideral tiene problemas"

    REGLAS GENERALES:
    - Siempre nombrar al personaje en L1
    - El remate (L2) debe tener consecuencia
      real o dato verificable
    - Emojis solo al final de L2, nunca en L1
    - CAPS solo en verbos de acción extrema

    PATRONES NUEVOS CONFIRMADOS:

    PATRÓN 6 — Humor con personaje del lore:
    ✅ "Hasta el Zein se vacila XD"
    Corto, sin explicar, la comunidad sabe.

    PATRÓN 7 — Meme de Macarius:
    ✅ "Macarius el abogado de streamers
        entra a parchar a Sideral XD"

    PATRÓN 8 — Apodo beba:
    ✅ "Toda una beba"
    Máxima brevedad, sin explicación.

    REGLA — Clips que hablan solos:
    Si el momento es tan impactante que el
    título restaría impacto usar:
    texto_linea1: ""
    texto_linea2: ""
