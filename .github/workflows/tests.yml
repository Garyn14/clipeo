name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: FFmpeg
        # apt-get a veces se cuelga esperando un mirror (S7 y S12: el job se canceló a los 15 min sin correr tests):
        # cada intento tiene su propio límite y se reintenta hasta 3 veces
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -q && timeout 180 sudo apt-get install -y -q --no-install-recommends ffmpeg && break
            echo "FFmpeg: intento $i falló, reintentando..."; sleep 10
          done
          ffmpeg -version | head -1
      - name: Dependencias de test
        run: pip install -r requirements-test.txt
      - name: Tests (evaluación + piloto)
        run: python -m pytest -q tests legacy/tests
